<svg xmlns="http://www.w3.org/2000/svg" width="900" height="322" viewBox="0 0 900 322" fill="none" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
<stop offset="0" stop-color="#00E5FF"/><stop offset="0.5" stop-color="#FF3B5C"/><stop offset="1" stop-color="#FFB020"/>
<animateTransform attributeName="gradientTransform" type="translate" values="0 0;450 0;0 0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>

</defs>
<style>
text{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif;}
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace;}
.pp{opacity:0;transform-box:fill-box;transform-origin:center;animation:ppin .3s cubic-bezier(.3,1.6,.5,1) forwards;}
@keyframes ppin{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.blink{animation:bl 1s infinite steps(1);} @keyframes bl{50%{opacity:0}}
.ln{opacity:0;animation:ln .5s ease-out forwards;} @keyframes ln{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.gl{animation:ln .5s ease-out forwards, gj 7s infinite steps(1);}
@keyframes gj{0%,92%,100%{transform:none} 93%{transform:translateX(-6px)} 94%{transform:translateX(5px)} 95%{transform:none}}
.scan{animation:scan 7s 4s infinite steps(1);} @keyframes scan{0%,92%,100%{opacity:0;transform:none} 93%{opacity:.5;transform:translateY(90px)} 94%{opacity:.4;transform:translateY(160px)} 95%{opacity:0}}
</style>
<rect x="0.5" y="0.5" width="899" height="321" rx="4" fill="#0C0E16" stroke="#1C2133" stroke-opacity="1"/>
<rect x="0.5" y="0.5" width="899" height="36" rx="4" fill="#10131D"/>
<line x1="0" y1="37" x2="900" y2="37" stroke="#1C2133"/>
<rect x="18" y="13" width="12" height="12" fill="#00E5FF"/><rect x="38" y="13" width="12" height="12" fill="#FF3B5C"/><rect x="58" y="13" width="12" height="12" fill="#FFB020"/>
<text class="mono" x="450.0" y="23" font-size="12" fill="#626A82" text-anchor="middle">kai@darmstadt: ~/about</text>
<g class="ln" style="animation-delay:0.25s"><text class="mono" x="26" y="74" font-size="12" fill="#1C2133">01</text><text class="mono" x="58" y="74" font-size="14.5"><tspan fill="#00E5FF">❯ </tspan><tspan fill="#E8EAF2">cat about.yml</tspan></text></g>
<g class="ln" style="animation-delay:0.70s"><text class="mono" x="26" y="101" font-size="12" fill="#1C2133">02</text><text class="mono" x="58" y="101" font-size="14.5"><tspan fill="#00E5FF">name</tspan><tspan fill="#626A82">: </tspan><tspan fill="#FFB020">Archit "Kai" Sharma</tspan></text></g>
<g class="ln" style="animation-delay:1.15s"><text class="mono" x="26" y="128" font-size="12" fill="#1C2133">03</text><text class="mono" x="58" y="128" font-size="14.5"><tspan fill="#00E5FF">study</tspan><tspan fill="#626A82">: </tspan><tspan fill="#E8EAF2">MSc AI &amp; ML @ TU Darmstadt  </tspan><tspan fill="#626A82"># grad 2027</tspan></text></g>
<g class="ln gl" style="animation-delay:1.60s;animation-delay:1.60s,7.00s"><text class="mono" x="26" y="155" font-size="12" fill="#1C2133">04</text><text class="mono" x="58" y="155" font-size="14.5"><tspan fill="#00E5FF">before</tspan><tspan fill="#626A82">: </tspan><tspan fill="#E8EAF2">Product Engineer @ EffiGO </tspan><tspan fill="#626A82">— </tspan><tspan fill="#E8EAF2">GenAI apps + MLOps on GCP/AWS/Azure</tspan></text></g>
<g class="ln" style="animation-delay:2.05s"><text class="mono" x="26" y="182" font-size="12" fill="#1C2133">05</text><text class="mono" x="58" y="182" font-size="14.5"><tspan fill="#00E5FF">focus</tspan><tspan fill="#626A82">: </tspan><tspan fill="#FF3B5C">[</tspan><tspan fill="#E8EAF2">causal inference, PGMs, grounded GenAI, neuro-symbolic</tspan><tspan fill="#FF3B5C">]</tspan></text></g>
<g class="ln" style="animation-delay:2.50s"><text class="mono" x="26" y="209" font-size="12" fill="#1C2133">06</text><text class="mono" x="58" y="209" font-size="14.5"><tspan fill="#00E5FF">now</tspan><tspan fill="#626A82">: </tspan><tspan fill="#E8EAF2">visual hallucinations in multimodal reasoning traces</tspan></text></g>
<g class="ln gl" style="animation-delay:2.95s;animation-delay:2.95s,10.00s"><text class="mono" x="26" y="236" font-size="12" fill="#1C2133">07</text><text class="mono" x="58" y="236" font-size="14.5"><tspan fill="#00E5FF">rule</tspan><tspan fill="#626A82">: </tspan><tspan fill="#FFB020">"every claim traced back to its evidence"</tspan></text></g>
<g class="ln" style="animation-delay:3.40s"><text class="mono" x="26" y="263" font-size="12" fill="#1C2133">08</text><text class="mono" x="58" y="263" font-size="14.5"><tspan fill="#00E5FF">open_to</tspan><tspan fill="#626A82">: </tspan><tspan fill="#FF3B5C">[</tspan><tspan fill="#E8EAF2">werkstudent (thesis-compatible), full-time 2027</tspan><tspan fill="#FF3B5C">]</tspan></text></g>
<text class="mono ln" x="58" y="290" font-size="14.5" fill="#00E5FF" style="animation-delay:3.85s">❯ <tspan fill="#FFB020" class="blink">█</tspan></text>
