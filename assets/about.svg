<rect x="0.5" y="0.5" width="899" height="321" rx="4" fill="none" stroke="#00E5FF" stroke-width="1.6" pathLength="100" stroke-dasharray="10 90" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-100" dur="9s" repeatCount="indefinite"/></rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
