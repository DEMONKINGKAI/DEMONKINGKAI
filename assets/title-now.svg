<svg xmlns="http://www.w3.org/2000/svg" width="900" height="58" viewBox="0 0 900 58" fill="none" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
<stop offset="0" stop-color="#00E5FF"/><stop offset="0.5" stop-color="#9B5CFF"/><stop offset="1" stop-color="#FFB020"/>
<animateTransform attributeName="gradientTransform" type="translate" values="0 0;450 0;0 0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>

</defs>
<style>
text{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif;}
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace;}

</style>
<rect x="0.5" y="0.5" width="899" height="57" rx="12" fill="#0C0E16" stroke="#1C2133"/>
<clipPath id="tc"><rect width="900" height="58" rx="12"/></clipPath>
<text class="mono" x="24" y="35" font-size="13" fill="#626A82">04</text>
<text class="mono" x="56" y="36" font-size="21" font-weight="700" fill="#E8EAF2"><tspan fill="#00E5FF">//</tspan> currently</text>
<g clip-path="url(#tc)"><rect x="-180" y="55" width="180" height="3" rx="1.5" fill="#00E5FF" filter="url(#glow)"><animate attributeName="x" values="-180;900" dur="4.5s" repeatCount="indefinite"/></rect></g>
<circle cx="872" cy="29" r="4" fill="#00E5FF"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
